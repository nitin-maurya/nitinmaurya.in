# Static server for portfolio.nitinmaurya.in (nginx:alpine container behind Dokploy's Traefik).
# TLS is terminated by Traefik; this container only speaks HTTP on the internal dokploy-network.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # If you edit the JSON-LD block in index.html, regenerate its sha256 hash here.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-Lk0V124zfArhPy4/vkuQq7TvX8LvcDfOwOwxuDYIxYg='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://formspree.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self' mailto:; upgrade-insecure-requests" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain;
    gzip_min_length 512;

    location ~* \.(css|js|svg|png|jpg|webp|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /Nitin_Maurya_Resume.pdf {
        add_header Content-Disposition 'attachment; filename="Nitin_Maurya_Resume.pdf"';
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ /\.(?!well-known) { deny all; }

    error_page 404 /404.html;
    location / { try_files $uri $uri/ =404; }
}
