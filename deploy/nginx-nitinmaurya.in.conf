# /etc/nginx/sites-available/nitinmaurya.in
# HTTP -> HTTPS (certbot will manage the cert paths below)
server {
    listen 80;
    listen [::]:80;
    server_name nitinmaurya.in www.nitinmaurya.in;
    location /.well-known/acme-challenge/ { root /var/www/nitinmaurya.in; }
    location / { return 301 https://nitinmaurya.in$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.nitinmaurya.in;
    ssl_certificate     /etc/letsencrypt/live/nitinmaurya.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nitinmaurya.in/privkey.pem;
    return 301 https://nitinmaurya.in$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nitinmaurya.in;

    root  /var/www/nitinmaurya.in;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/nitinmaurya.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nitinmaurya.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;

    # --- Security headers (a security architect's site should score A+) ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    # If you set CONTACT_ENDPOINT in main.js (e.g. Formspree), add its origin to connect-src.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-1C4NZHyXEnK9Rn1EhOjVqmlu6CgDCw4Cis39H2wRX1I='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://formspree.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self' mailto:; upgrade-insecure-requests" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain;
    gzip_min_length 512;

    location ~* \.(css|js|svg|png|jpg|webp|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /Nitin_Maurya_Resume.pdf {
        add_header Content-Disposition 'attachment; filename="Nitin_Maurya_Resume.pdf"';
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ /\.(?!well-known) { deny all; }
    location ^~ /deploy/ { deny all; }

    error_page 404 /404.html;
    location / { try_files $uri $uri/ =404; }
}
